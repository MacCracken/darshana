name: Release

# Triggers on plain X.Y.Z semver tags only (1.0.0, 1.2.3), with an optional
# leading `v` (v1.0.0). Pre-release tags such as 2.0.0-rc1 do NOT trigger:
# the filter globs match the whole ref. (Through v1.1.3 this comment said
# they did.)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

# v1.1.4: least privilege. Through v1.1.3 `contents: write` sat here, so every
# job held a write token — including the reused CI gate, which runs the whole
# test and build toolchain. Only the `release` job publishes, so only it gets
# write (see its own `permissions:` block); everything else reads.
#
# Third-party actions are pinned by commit SHA, with the tag they resolved from
# in a trailing comment. A mutable tag (`@v4`) lets whoever controls that tag
# change the code that runs here — and these jobs build and upload the
# artifacts consumers download. To bump one, resolve the new tag to its commit
# (GitHub API `git/ref/tags/<tag>`) and update both the SHA and the comment.
permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Gate — full CI must pass before anything builds for release.
  # Reuses ci.yml via workflow_call so a release can never ship a
  # dist artifact that hasn't passed lint / tests / smoke / distlib
  # drift / DCE parity / security scan / docs check.
  # ────────────────────────────────────────────────────────────────
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ────────────────────────────────────────────────────────────────
  # Verify — VERSION file, cyrius.cyml indirection, and the git tag
  # must all agree before anything is packaged. darshana has no
  # baked-in version literal in source (the dist header is generated
  # by `cyrius distlib` from VERSION at build time); the distlib
  # drift step in CI catches stale bundles.
  # ────────────────────────────────────────────────────────────────
  version-verify:
    name: Version verify
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Extract VERSION / tag / cyml version
        id: extract
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v'
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::tag ($TAG) is not semver"; exit 1; }

          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file:  $VERSION"
          echo "git tag:       $TAG"

          if ! grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml; then
            echo "::error::cyrius.cyml version no longer resolves via \${file:VERSION}" >&2
            exit 1
          fi

          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::VERSION ($VERSION) != git tag ($TAG)" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────
  # Package — regenerate dist/darshana.cyr from current sources, then
  # bundle dist artifact + project metadata. darshana is a library;
  # the consumable is dist/darshana.cyr (NOT a binary). The
  # build/darshana-smoke binary stays in CI as proof-of-link only —
  # not shipped.
  # ────────────────────────────────────────────────────────────────
  package:
    name: Package
    needs: version-verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout. From 6.5.x
        # `cyrius deps` resolves the stdlib snapshot from
        # $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard-fails with
        # "pins version X but it is not installed" if only the flattened
        # dirs exist. The installer lays out versions/<v>/{bin,lib} and
        # symlinks bin/ + lib/ at it, and additionally does SHA256 +
        # signature verification the hand-rolled block skipped. Same
        # pattern as patra / libro.
        #
        # v1.1.4: fetched at the pinned tag, not `main` — the installer
        # carries the release-signing public key, so its source must be as
        # pinned as the version it installs. Same fix as ci.yml.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh" | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dist is current
        # v1.1.4: verify, do not regenerate. Through v1.1.3 this step ran
        # `cyrius distlib` and shipped whatever it produced — bytes the CI
        # gate above never saw. `--check` fails (exit 1) if either committed
        # artifact, the bundle or the sidecar, is stale, so the release
        # ships exactly the bytes that were tested and tagged.
        run: |
          cyrius distlib --check
          echo "dist/darshana.cyr: $(wc -c < dist/darshana.cyr) bytes"
          echo "dist/darshana.deps: $(wc -l < dist/darshana.deps) lines"

      - name: Package dist artifact
        # The dist artifacts — dist/darshana.cyr and its stdlib-leaf
        # sidecar dist/darshana.deps — plus minimal project metadata.
        # Consumers fetch these via cyrius deps from the GH release, not
        # from a tarball, but we ship a tarball too for offline mirrors /
        # vendoring. v1.1.4: the sidecar ships too; without it a vendored
        # bundle does not say which stdlib leaves it needs.
        run: |
          PKG="darshana-${VERSION}"
          mkdir -p "pkg/$PKG"
          cp dist/darshana.cyr dist/darshana.deps "pkg/$PKG/"
          cp README.md LICENSE CHANGELOG.md VERSION cyrius.cyml "pkg/$PKG/"
          mkdir -p out
          tar czf "out/${PKG}.tar.gz" -C pkg "$PKG"
          # Also publish both dist artifacts standalone for direct fetch.
          cp dist/darshana.cyr  "out/darshana-${VERSION}.cyr"
          cp dist/darshana.deps "out/darshana-${VERSION}.deps"

      - name: Generate SHA256
        run: |
          cd out
          sha256sum *.tar.gz *.cyr *.deps > SHA256SUMS.dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-dist
          path: |
            out/*.tar.gz
            out/*.cyr
            out/*.deps
            out/SHA256SUMS.*

  # ────────────────────────────────────────────────────────────────
  # Source tarball — language-agnostic, always linux runner.
  # ────────────────────────────────────────────────────────────────
  source:
    name: Source tarball
    needs: version-verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Create source tarball
        run: |
          mkdir -p out
          git archive --format=tar.gz \
            --prefix="darshana-${VERSION}/" \
            -o "out/darshana-${VERSION}-src.tar.gz" HEAD
          cd out
          sha256sum "darshana-${VERSION}-src.tar.gz" > SHA256SUMS.src

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-source
          path: |
            out/*.tar.gz
            out/SHA256SUMS.src

  # ────────────────────────────────────────────────────────────────
  # Release — collect artifacts + checksums, publish GitHub release.
  # Body pulled from the matching CHANGELOG.md section. Pre-1.0
  # releases publish as prerelease so package managers don't
  # auto-promote them.
  # ────────────────────────────────────────────────────────────────
  release:
    name: GitHub release
    needs: [package, source, version-verify]
    runs-on: ubuntu-latest
    # The one job that writes: it creates the GitHub release and uploads assets.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version-verify.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist-raw

      - name: Consolidate artifacts
        run: |
          mkdir -p out
          find dist-raw -type f \( -name '*.tar.gz' -o -name '*.cyr' -o -name '*.deps' -o -name 'SHA256SUMS.*' \) \
            -exec cp {} out/ \;
          cd out
          cat SHA256SUMS.* | sort -u > SHA256SUMS
          rm -f SHA256SUMS.*
          ls -la

      - name: Extract release body from CHANGELOG
        run: |
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/         { exit }
            found                    { print }
          ' CHANGELOG.md > /tmp/body.md
          if [ ! -s /tmp/body.md ]; then
            echo "::warning::CHANGELOG.md has no body for ${VERSION}; falling back to generated notes"
          fi

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: "darshana ${{ env.VERSION }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(env.VERSION, '0.') }}
          files: |
            out/*.tar.gz
            out/*.cyr
            out/*.deps
            out/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
