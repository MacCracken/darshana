name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout. From 6.5.x
        # `cyrius deps` resolves the stdlib snapshot from
        # $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard-fails with
        # "pins version X but it is not installed" if only the flattened
        # dirs exist. The installer lays out versions/<v>/{bin,lib} and
        # symlinks bin/ + lib/ at it, and additionally does SHA256 +
        # signature verification the hand-rolled block skipped. Same
        # pattern as patra / libro.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        # darshana is a library; no external deps yet, just stdlib.
        # Footprint is tight (syscalls/alloc/io/assert) — see cyrius.cyml.
        run: cyrius deps

      - name: Build smoke binary
        run: |
          mkdir -p build
          cyrius build programs/smoke.cyr build/darshana-smoke

      - name: Run smoke binary
        # Compile-link smoke proves the include chain resolves end-to-end
        # and the dead-code-eliminator hasn't dropped a live symbol.
        run: |
          out=$(./build/darshana-smoke)
          test "$out" = "darshana smoke ok" || { echo "smoke output mismatch: $out"; exit 1; }

      - name: Lint
        # Same tolerance policy as chakshu/owl/cyim: every src file
        # clean; the only acceptable warning is the cosmetic
        # "exceeds 120 characters" rule on comment-divider lines.
        # cyrius lint exits non-zero on any output, so we wrap in
        # `|| true` to coexist with the implicit `set -e`.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*warn ' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: non-cosmetic warnings present"; exit 1; }

      - name: Test
        # Explicit path — bare `cyrius test` (no arg) relies on
        # auto-discovery that has varied between cyrius releases
        # (and failed in CI on 5.10.20 with "No .tcyr files found in
        # tests/tcyr/ or tests/" despite tests/darshana.tcyr being
        # checked in). The documented form per `cyrius help test` is
        # `cyrius test <test.cyr>`; using it explicitly avoids the
        # discovery surface entirely.
        run: cyrius test tests/darshana.tcyr

      - name: Test (PTY harness)
        # tests/pty.tcyr is NOT reached by the explicit single-file step
        # above (and bare `cyrius test` auto-discovery is unreliable —
        # see the rationale on the previous step), so without its own
        # step the v0.6.0 syscall + fd-1 escape coverage never runs in
        # CI. ubuntu-latest exposes /dev/ptmx, so the harness runs its
        # full assertion set here. The harness is skip-clean by design;
        # a 'SKIP pty:' token means the runner degraded (no pty / blocked
        # ioctl) — surfaced as a warning, not a hard failure.
        run: |
          out=$(cyrius test tests/pty.tcyr)
          echo "$out"
          if echo "$out" | grep -q 'SKIP pty:'; then
            echo "::warning::pty.tcyr ran degraded (SKIP token present) — PTY coverage incomplete on this runner"
          fi

      - name: Project smoke (scripts/smoke.sh)
        run: bash scripts/smoke.sh

      - name: distlib drift check
        # Regenerate dist/darshana.cyr from current sources and verify
        # it matches what's checked in. Without this, src/ changes can
        # land without the dist artifact getting refreshed — and
        # downstream consumers `include "lib/darshana.cyr"` (which is
        # this dist file), not src/. Drift here = consumers shipping
        # stale code.
        run: |
          cp dist/darshana.cyr /tmp/dist-checked-in.cyr
          cyrius distlib > /dev/null
          diff -q /tmp/dist-checked-in.cyr dist/darshana.cyr \
            || { echo "FAIL: dist/darshana.cyr is stale. Run 'cyrius distlib' and commit."; exit 1; }

      - name: DCE parity check
        # Release builds set CYRIUS_DCE=1. The DCE'd smoke binary
        # must produce the same output as the debug build, or the
        # DCE pass dropped something live.
        run: |
          CYRIUS_DCE=1 cyrius build programs/smoke.cyr build/darshana-smoke-dce
          echo "darshana-smoke-dce: $(wc -c < build/darshana-smoke-dce) bytes"
          out=$(./build/darshana-smoke-dce)
          test "$out" = "darshana smoke ok" || { echo "DCE smoke mismatch: $out"; exit 1; }

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for forbidden patterns in src/
        # darshana CLAUDE.md "Don't" invariants: no FFI / libc /
        # ncurses; Linux-only at v0.1.0–v0.4.x with the syscall arm
        # gated. Scan rules mirror chakshu's setup so the AGNOS
        # first-party stack stays uniformly hardened.
        run: |
          FAIL=0

          # No FFI / dynlib / pam imports (CLAUDE.md "no FFI / libc").
          ffi_hits=$(grep -rnE 'include "lib/(cffi|dynlib|fdlopen|pam)\.cyr"' src/ 2>/dev/null || true)
          if [ -n "$ffi_hits" ]; then
            echo "FAIL: FFI/dynlib/pam library import"
            echo "$ffi_hits"
            FAIL=1
          fi

          # Heap-allocate large data — same 64 KiB threshold owl/cyim/chakshu use.
          # darshana's stack buffers are termios (60 bytes) and the
          # cursor escape buf (32 bytes); flagging anything >= 64 KiB
          # catches a future contributor mistake.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr > /tmp/bigbuf.txt
          if [ -s /tmp/bigbuf.txt ]; then
            cat /tmp/bigbuf.txt
            FAIL=1
          fi

          # Linux-syscall arm must remain gated. termios.cyr's
          # SYS_IOCTL / TCGETS / TCSETS path uses Linux-specific magic
          # numbers; macOS/BSD termios layout differs, and agnos has no
          # ioctl at all.
          #
          # v0.9.3: POSITIONAL, not substring-presence. The previous
          # `grep -q '#ifdef CYRIUS_TARGET_LINUX'` had no relationship
          # to where the ioctl code actually sat — hoisting the entire
          # arm outside the gate left this step green, and nothing else
          # in CI would catch it (build-and-test is ubuntu-x86_64 only,
          # and cyrius does not error on a duplicate definition).
          # Mirrors the same check in scripts/smoke.sh so local and CI
          # agree.
          lin=$(awk '/^#ifdef CYRIUS_TARGET_LINUX/{s=NR;next} s&&/^#endif/{print s, NR; exit}' src/termios.cyr)
          agn=$(awk '/^#ifdef CYRIUS_TARGET_AGNOS/{s=NR;next} s&&/^#endif/{print s, NR; exit}' src/termios.cyr)
          if [ -z "$lin" ] || [ -z "$agn" ]; then
            echo "FAIL: src/termios.cyr missing a CYRIUS_TARGET_LINUX / _AGNOS gate"
            echo "  The ioctl/TCGETS/TCSETS arm is Linux-specific; macOS BSD"
            echo "  termios layout differs. Don't drop the gate without an"
            echo "  ADR documenting cross-platform termios handling."
            FAIL=1
          else
            stray_lin=$(grep -nE '(SYS_IOCTL|TCGETS|TCSETS|TIOCGWINSZ)' src/termios.cyr \
                        | grep -vE '^[0-9]+: *#' \
                        | awk -F: -v s="${lin% *}" -v e="${lin#* }" '$1 < s || $1 > e')
            if [ -n "$stray_lin" ]; then
              echo "FAIL: Linux ioctl tokens outside the CYRIUS_TARGET_LINUX gate (lines $lin):"
              echo "$stray_lin"
              FAIL=1
            fi
            stray_agn=$(grep -nE '_AGNOS_SYS_[A-Z]+|_AGNOS_SFD_' src/termios.cyr \
                        | grep -vE '^[0-9]+: *#' \
                        | awk -F: -v s="${agn% *}" -v e="${agn#* }" '$1 < s || $1 > e')
            if [ -n "$stray_agn" ]; then
              echo "FAIL: agnos syscall tokens outside the CYRIUS_TARGET_AGNOS gate (lines $agn):"
              echo "$stray_agn"
              FAIL=1
            fi
          fi

          # No command-exec sinks. darshana is a syscall-only primitive
          # library (ioctl + read/write); a shell-exec sink would be
          # both out of charter and a command-injection surface. The
          # CLAUDE.md "no sys_system with unsanitized input" rule,
          # enforced as "none at all" since darshana has no business
          # spawning processes.
          #
          # v0.9.3: the pattern now also covers RAW syscall numbers.
          # darshana's whole surface is `syscall(N, ...)`, so matching
          # only named stdlib wrappers could not see the one idiom the
          # library actually uses — a synthetic
          # `syscall(57)` / `syscall(59, path, 0, 0)` fork+exec pair
          # scored zero hits and the job exited green. Numbers covered
          # (x86_64/aarch64): 56 clone, 57 fork, 58 vfork, 59 execve,
          # 221 execveat(aarch64 221 is not exec — kept for x86_32
          # parity), 281 execveat(x86_64), 322 execveat(aarch64),
          # 435 clone3. NOTE: this is still a denylist; the roadmap
          # tracks inverting it into a syscall ALLOWLIST, which is the
          # right long-term shape for a raw-syscall library.
          exec_hits=$(grep -rnE '\bsys_system\b|\bsys_exec[a-z]*\b|\bsystem\s*\(|syscall\s*\(\s*(56|57|58|59|221|281|322|435)\b' src/ 2>/dev/null || true)
          if [ -n "$exec_hits" ]; then
            echo "FAIL: command-exec sink in src/ (darshana is syscall-only, must not spawn processes)"
            echo "$exec_hits"
            FAIL=1
          fi

          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        # Set commits to maintaining at v0.2.0. SECURITY.md /
        # CODE_OF_CONDUCT.md will join when we have content.
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION LICENSE \
                   cyrius.cyml CLAUDE.md \
                   docs/development/roadmap.md docs/development/state.md \
                   docs/adr/0001-name-darshana.md \
                   dist/darshana.cyr; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # Single source of truth is the VERSION file. Two derived
        # surfaces must agree: the CHANGELOG section header and the
        # cyrius.cyml file: indirection. The dist/darshana.cyr header
        # is regenerated by `cyrius distlib` from VERSION at build
        # time — drift is caught by build-and-test's distlib-drift
        # step, not here.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -qE "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md missing section [${VERSION}]"; exit 1; }
          grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version no longer pulls from VERSION"; exit 1; }
          echo "Version consistent: VERSION = CHANGELOG = cyrius.cyml = $VERSION"
