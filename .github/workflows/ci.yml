name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:                    # reusable by release.yml as a gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# v1.1.4: least privilege. No job here writes to the repository, so the token
# is read-only. Without this block the token gets the repository's default,
# which can be read-write. release.yml reuses this workflow as its gate, and a
# reusable workflow can only narrow its caller's permissions, never widen them.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout. From 6.5.x
        # `cyrius deps` resolves the stdlib snapshot from
        # $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard-fails with
        # "pins version X but it is not installed" if only the flattened
        # dirs exist. The installer lays out versions/<v>/{bin,lib} and
        # symlinks bin/ + lib/ at it, and additionally does SHA256 +
        # signature verification the hand-rolled block skipped. Same
        # pattern as patra / libro.
        #
        # v1.1.4: the installer is fetched AT THE PINNED TAG, not from
        # `main`. install.sh embeds the Ed25519 public key that verifies the
        # release tarball's signature, so fetching it from a moving branch
        # left the trust anchor itself unpinned — whatever `main` said the
        # key was, CI believed. The tag is derived from the same cyrius.cyml
        # pin, so no version is hardcoded here. Verified for 6.6.20: the tag's
        # installer, run into a scratch CYRIUS_HOME, installs 6.6.20 with
        # "checksum verified" and "signature verified (Ed25519)" and ships
        # bin/cycc_aarch64.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh" | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      # Every gate below is a function in scripts/ci.sh (v1.1.4), so a local
      # `bash scripts/ci.sh <gate>` — or `all` — runs literally what CI runs.
      # Each gate's rationale lives beside its code there. Only environment
      # setup (the toolchain install above, the qemu apt-get below) is YAML.

      - name: Verify toolchain layout
        run: bash scripts/ci.sh toolchain

      - name: Resolve dependencies
        run: bash scripts/ci.sh deps

      - name: Build + run smoke binary
        run: bash scripts/ci.sh smoke-binary

      - name: Lint
        run: bash scripts/ci.sh lint

      - name: Test
        run: bash scripts/ci.sh unit

      - name: Test (PTY harness)
        run: bash scripts/ci.sh pty

      - name: Test (emitted-byte identity + byte budgets)
        run: bash scripts/ci.sh identity

      - name: Build + run examples
        run: bash scripts/ci.sh examples

      - name: Cross-build + test the AGNOS arm
        run: bash scripts/ci.sh agnos

      - name: Install qemu-user (for the aarch64 arm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Cross-build + test the aarch64 arm
        run: bash scripts/ci.sh aarch64

      - name: Project smoke (scripts/smoke.sh)
        run: bash scripts/ci.sh project-smoke

      - name: distlib drift check
        run: bash scripts/ci.sh distlib-drift

      - name: DCE parity check
        run: bash scripts/ci.sh dce

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Scan for forbidden patterns, platform gates, syscall allowlist
        # Pure shell: this job installs no toolchain.
        run: bash scripts/ci.sh security

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Required files + version consistency
        run: bash scripts/ci.sh docs
